<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification</title>
  <!-- render=explicit + onload= are REQUIRED: the default (implicit) mode
       only auto-renders .cf-turnstile divs that carry a data-sitekey
       attribute, and never invokes onloadTurnstileCallback — our sitekey
       arrives via query param, so we must render explicitly from the
       onload hook. Without these params the page renders the label and
       nothing else. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onloadTurnstileCallback" defer></script>
  <style>
    body { margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, sans-serif; background: #000; color: #fff; }
    .box { text-align: center; }
    .label { margin-bottom: 16px; font-size: 14px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="box">
    <div class="label">Verifying you're human</div>
    <div id="ts"></div> <!-- no cf-turnstile class: avoids implicit-mode double render -->
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var siteKey = params.get('sitekey') || '';
      var redirect = params.get('redirect') || 'wuvo://turnstile-callback';
      if (!siteKey) { document.body.innerText = 'Missing site key'; return; }
      window.onloadTurnstileCallback = function () {
        window.turnstile.render('#ts', {
          sitekey: siteKey,
          callback: function (token) {
            window.location.replace(redirect + '?token=' + encodeURIComponent(token));
          },
          'error-callback': function () {
            window.location.replace(redirect + '?error=challenge_failed');
          },
        });
      };
      if (window.turnstile) window.onloadTurnstileCallback();
    })();
  </script>
</body>
</html>
